{% include analytics.html %}
{% include fetch_google_scholar_stats.html %}

<script>
/* 中英原地切换：内容区 + 导航菜单文字/锚点同步切换，不跳转页面 */
(function () {
  var zh = document.getElementById('content-zh');
  var en = document.getElementById('content-en');
  var toggle = document.getElementById('lang-toggle');
  if (!zh || !en || !toggle) return;

  var saved = null;
  try { saved = localStorage.getItem('acad-lang'); } catch (e) {}
  var lang = saved === 'en' ? 'en' : 'zh';

  function apply(l) {
    zh.style.display = l === 'zh' ? '' : 'none';
    en.style.display = l === 'en' ? '' : 'none';
    toggle.textContent = l === 'zh' ? 'EN' : '中文';
    document.documentElement.lang = l;
    /* 同步导航菜单：文字与锚点随语言切换 */
    var links = document.querySelectorAll('.masthead__menu-item a');
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      if (a.id === 'lang-toggle') continue;
      var zhT = a.getAttribute('data-zh');
      var enT = a.getAttribute('data-en');
      if (zhT || enT) a.textContent = l === 'zh' ? zhT : enT;
      var zhH = a.getAttribute('data-zh-href');
      var enH = a.getAttribute('data-en-href');
      if (zhH && enH) a.setAttribute('href', l === 'zh' ? zhH : enH);
    }
  }
  apply(lang);

  toggle.addEventListener('click', function (e) {
    e.preventDefault();
    var next = zh.style.display === 'none' ? 'zh' : 'en';
    apply(next);
    try { localStorage.setItem('acad-lang', next); } catch (err) {}
  });
})();
</script>
